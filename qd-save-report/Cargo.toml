[package]
name = "qd-save-report"
version = "0.1.0"
edition = "2021"
description = "Reads a Queen's Domain save folder and writes an HTML achievement / completion report"
license = "MIT"

# No external dependencies: the GVAS save parser, the .pak reader and the
# .uasset property parser are all implemented in this crate.
[dependencies]

[profile.release]
opt-level = 3
lto = true
